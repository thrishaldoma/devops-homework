apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-rolling
  labels:
    app: app-rolling
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1          # at most 3+1 = 4 pods during the rollout
      maxUnavailable: 0    # never drop below 3 ready pods -> zero downtime
  selector:
    matchLabels:
      app: app-rolling
  template:
    metadata:
      labels:
        app: app-rolling
        version: v1
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "<h1>App Rolling</h1><p>VERSION: v1</p>" > /usr/share/nginx/html/index.html
              exec nginx -g 'daemon off;'
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 3
