# Same Service object in both files - only the slot selector differs.
# Applying the other file is the whole cutover.
apiVersion: v1
kind: Service
metadata:
  name: myapp-service
spec:
  type: NodePort
  selector:
    app: myapp
    slot: blue
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30020
