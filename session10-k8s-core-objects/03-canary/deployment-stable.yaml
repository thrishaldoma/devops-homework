apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-stable
  labels:
    app: myapp-canary
    track: stable
spec:
  replicas: 9
  selector:
    matchLabels:
      app: myapp-canary
      track: stable
  template:
    metadata:
      labels:
        app: myapp-canary     # shared label -> both tracks join the same Service
        track: stable
        version: v1
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          command: ["/bin/sh", "-c"]
          args:
            - echo "STABLE v1" > /usr/share/nginx/html/index.html && exec nginx -g 'daemon off;'
          ports:
            - containerPort: 80
