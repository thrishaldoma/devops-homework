# Waiting reason: CrashLoopBackOff - container keeps exiting 1 while
# restartPolicy: Always keeps restarting it, with exponential backoff
# (10s, 20s, 40s ... capped at 5m).
apiVersion: v1
kind: Pod
metadata:
  name: lifecycle-crashloop
spec:
  restartPolicy: Always
  containers:
    - name: crasher
      image: busybox:1.36
      command: ["/bin/sh", "-c", "echo 'starting up...'; echo 'FATAL: cannot reach database'; exit 1"]
