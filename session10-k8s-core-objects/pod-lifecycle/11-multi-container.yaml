# Multi-container pod - app + logging sidecar sharing an emptyDir volume
# and the same network namespace. READY shows 2/2.
apiVersion: v1
kind: Pod
metadata:
  name: lifecycle-multi-container
spec:
  volumes:
    - name: shared-logs
      emptyDir: {}
  containers:
    - name: app
      image: busybox:1.36
      command: ["/bin/sh", "-c", "i=0; while true; do i=$((i+1)); echo \"$(date '+%H:%M:%S') app request #$i\" >> /var/log/app.log; sleep 5; done"]
      volumeMounts:
        - name: shared-logs
          mountPath: /var/log
    - name: sidecar
      image: busybox:1.36
      command: ["/bin/sh", "-c", "sleep 5; tail -f /var/log/app.log"]
      volumeMounts:
        - name: shared-logs
          mountPath: /var/log
