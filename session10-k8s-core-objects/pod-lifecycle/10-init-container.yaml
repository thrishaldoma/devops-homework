# Init container - runs to completion before the app container starts.
# The pod stays in Init:0/1 until the prerequisite finishes.
apiVersion: v1
kind: Pod
metadata:
  name: lifecycle-init
spec:
  initContainers:
    - name: setup
      image: busybox:1.36
      command: ["/bin/sh", "-c", "echo 'running migrations / warming cache'; sleep 15; echo 'setup complete'"]
  containers:
    - name: app
      image: nginx:1.27-alpine
      ports:
        - containerPort: 80
