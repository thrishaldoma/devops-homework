# Graceful termination - the app traps SIGTERM and performs cleanup.
# Deletion therefore takes ~10s instead of being instant.
apiVersion: v1
kind: Pod
metadata:
  name: lifecycle-termination
spec:
  terminationGracePeriodSeconds: 30
  containers:
    - name: graceful
      image: busybox:1.36
      command:
        - /bin/sh
        - -c
        - |
          trap 'echo "SIGTERM received - draining connections"; sleep 10; echo "cleanup complete"; exit 0' TERM
          echo "serving traffic"
          while true; do sleep 1; done
