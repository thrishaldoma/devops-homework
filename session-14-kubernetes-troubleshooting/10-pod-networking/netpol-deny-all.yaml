# BROKEN ON PURPOSE: a default-deny NetworkPolicy.
# Pod-to-pod traffic inside a namespace is normally unrestricted. This policy
# selects every pod and allows no ingress, so connections are DROPPED - not
# refused. The distinction matters when debugging: a refused connection fails
# instantly, a dropped one HANGS until timeout.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: netpol-demo
spec:
  podSelector: {}        # every pod in the namespace
  policyTypes:
    - Ingress            # no ingress rules listed => deny all inbound
