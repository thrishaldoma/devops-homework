# FIX: supply the DATABASE_URL the application requires.
# In production this would come from a ConfigMap/Secret (see Session 12), not a
# literal. Note that a bare Pod's env cannot be patched in place - `kubectl set
# env pod/...` is rejected, because only image/tolerations/activeDeadlineSeconds
# are mutable on a running Pod. The pod must be recreated.
apiVersion: v1
kind: Pod
metadata:
  name: fail-1-crashloop-pod
  labels: { tier: triage-gauntlet, scenario: crashloop }
spec:
  containers:
    - name: python-app
      image: python:3.11-alpine
      env:
        - name: PYTHONUNBUFFERED      # else print() is buffered and `kubectl logs` is EMPTY
          value: "1"
        - name: DATABASE_URL
          value: "postgres://postgres.default.svc.cluster.local:5432/yatri"
      command:
        - "python3"
        - "-c"
        - |
          import os, sys, time
          db_url = os.environ.get("DATABASE_URL")
          if not db_url:
              print("[FATAL ERROR]: DATABASE_URL environment variable is MISSING!", file=sys.stderr)
              sys.exit(1)
          print("Application started successfully! DATABASE_URL=%s" % db_url)
          time.sleep(3600)
