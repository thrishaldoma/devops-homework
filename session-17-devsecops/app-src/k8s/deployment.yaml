# Security-hardened Deployment for the DevSecOps demo.
#
# The course reference (../../reference/deployment-course-reference.yaml) has no
# securityContext, no probes and no resource limits. Each addition below closes a
# specific gap that a cluster policy scanner (or a real incident) would find.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: session17-python
  labels:
    app: session17-python
spec:
  replicas: 2
  selector:
    matchLabels:
      app: session17-python
  template:
    metadata:
      labels:
        app: session17-python
    spec:
      securityContext:
        runAsNonRoot: true          # refuse to start if the image would run as root
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault      # restrict the syscall surface
      containers:
        - name: session17-python
          image: devsecops-demo:__IMAGE_TAG__
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5001
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true     # nothing writes to the image layer
            capabilities:
              drop: ["ALL"]                  # no Linux capabilities at all
          resources:
            requests: { cpu: 50m,  memory: 64Mi }
            limits:   { cpu: 500m, memory: 256Mi }
          readinessProbe:
            httpGet: { path: /health, port: 5001 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 5001 }
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: tmp
              mountPath: /tmp       # gunicorn needs a writable /tmp
      volumes:
        - name: tmp
          emptyDir: {}
