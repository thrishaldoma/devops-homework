# clusterIP: None -> headless. CoreDNS returns one A record per ready pod
# instead of a single virtual IP, and each pod gets a stable DNS name
# <pod>.<service>.<namespace>.svc.cluster.local
apiVersion: v1
kind: Service
metadata:
  name: web-service-headless
spec:
  clusterIP: None
  selector:
    app: web-headless
  ports:
    - port: 80
      targetPort: 80
