# Multi-document manifest: the app's source, its Deployment and its Service
# all live in one file, separated by '---'. kubectl applies them in order.
apiVersion: v1
kind: ConfigMap
metadata:
  name: yatri-backend-src
  labels:
    app: yatri-app
data:
  server.py: |
    import os
    from http.server import BaseHTTPRequestHandler, HTTPServer

    KEYS = ["ENVIRONMENT", "LOG_LEVEL", "PORT", "DEFAULT_CURRENCY",
            "MAX_BOOKING_DAYS", "POSTGRES_USER", "POSTGRES_PASSWORD"]

    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            lines = ["Yatri Backend API", "path: %s" % self.path, "-" * 32]
            lines += ["%s: %s" % (k, os.environ.get(k, "<unset>")) for k in KEYS]
            body = ("\n".join(lines) + "\n").encode()
            self.send_response(200)
            self.send_header("Content-Type", "text/plain")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def log_message(self, *a):   # keep pod logs quiet
            pass

    HTTPServer(("", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: yatri-backend
  labels:
    app: yatri-app
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: yatri-app
      tier: backend
  template:
    metadata:
      labels:
        app: yatri-app
        tier: backend
    spec:
      containers:
        - name: api
          image: python:3.12-alpine
          command: ["python3", "/src/server.py"]
          # BULK injection: every key in the ConfigMap becomes an env var.
          envFrom:
            - configMapRef:
                name: yatri-app-config
          # GRANULAR injection: pick individual keys out of the Secret.
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: yatri-db-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: yatri-db-secret
                  key: POSTGRES_PASSWORD
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: src
              mountPath: /src
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 3
      volumes:
        - name: src
          configMap:
            name: yatri-backend-src
---
apiVersion: v1
kind: Service
metadata:
  name: yatri-backend-service
  labels:
    app: yatri-app
spec:
  type: ClusterIP
  selector:
    app: yatri-app
    tier: backend
  ports:
    - port: 8080
      targetPort: 8080
