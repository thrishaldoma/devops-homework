# Opaque secret. IMPORTANT: the values below are base64 ENCODED, not encrypted.
# Anyone with read access to this object can decode them instantly.
#   echo -n 'yatri_admin'    | base64  ->  eWF0cmlfYWRtaW4=
#   echo -n 'secretpassword' | base64  ->  c2VjcmV0cGFzc3dvcmQ=
# Note -n: without it, echo appends a newline that becomes part of the password.
apiVersion: v1
kind: Secret
metadata:
  name: yatri-db-secret
  labels:
    app: yatri-app
type: Opaque
data:
  POSTGRES_USER: eWF0cmlfYWRtaW4=
  POSTGRES_PASSWORD: c2VjcmV0cGFzc3dvcmQ=
